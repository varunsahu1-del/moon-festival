<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="Favicons/Yellow Transparency.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay — Moon Festival 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0EBE2;
    --card: #E8E1D6;
    --border: rgba(42,34,24,0.1);
    --text: #2A2218;
    --muted: rgba(42,34,24,0.45);
    --accent: #B06030;
    --accent-hover: #9A5028;
    --input-bg: #FAF7F2;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .moon-mark {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 36px 36px 32px;
  }

  .card-title {
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .card-heading {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 28px;
    line-height: 1.2;
  }

  .amount-row {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .amount-row:focus-within { border-color: var(--accent); }

  .amount-symbol {
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
    padding: 0 4px 0 16px;
    line-height: 1;
  }

  .amount-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    padding: 14px 16px 14px 6px;
    outline: none;
    font-variant-numeric: tabular-nums;
    width: 100%;
    -moz-appearance: textfield;
  }
  .amount-input::-webkit-outer-spin-button,
  .amount-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amount-input::placeholder { color: rgba(42,34,24,0.25); font-weight: 400; }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .req { color: var(--accent); font-size: 9px; }
  .opt { letter-spacing: normal; text-transform: none; font-family: 'DM Sans', sans-serif; font-size: 9px; opacity: 0.55; }

  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: rgba(42,34,24,0.3); }

  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 24px 0;
  }

  .pay-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Josefin Sans', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .pay-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .pay-methods {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .method-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: var(--muted);
    background: rgba(42,34,24,0.05);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
  }

  .error-msg {
    background: rgba(176,50,40,0.08);
    border: 0.5px solid rgba(176,50,40,0.2);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: rgba(176,50,40,0.85);
    margin-bottom: 16px;
    display: none;
  }

  .amount-display {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: -10px;
    margin-bottom: 16px;
    min-height: 18px;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 22px 24px; }
    .card-heading { font-size: 19px; }
    .amount-input { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="moon-mark">Moon Festival 2026</div>

<div class="card">
  <div class="card-title">Secure Payment</div>
  <div class="card-heading">Pay any amount</div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="amount-row">
    <span class="amount-symbol">₹</span>
    <input class="amount-input" type="number" id="amount" placeholder="0" min="1" max="1000000" inputmode="numeric">
  </div>
  <div class="amount-display" id="amountDisplay"></div>

  <div class="field">
    <label>Your Name <span class="req">*</span></label>
    <input type="text" id="name" placeholder="Full name" autocomplete="name">
  </div>
  <div class="field">
    <label>Mobile Number <span class="req">*</span></label>
    <input type="tel" id="phone" placeholder="+91 98765 43210" inputmode="tel" autocomplete="tel">
  </div>
  <div class="field">
    <label>Email <span class="opt">(optional)</span></label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Note <span class="opt">(optional)</span></label>
    <input type="text" id="note" placeholder="What is this payment for?">
  </div>
  <div class="field">
    <label>Coordinated by <span class="opt">(optional)</span></label>
    <input type="text" id="handled_by" placeholder="Team member who arranged this">
  </div>

  <div class="divider"></div>

  <button class="pay-btn" id="payBtn" onclick="submitPayment()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Pay Now
  </button>

  <div class="pay-methods">
    <span class="method-chip">UPI</span>
    <span class="method-chip">Credit Card</span>
    <span class="method-chip">Debit Card</span>
    <span class="method-chip">Net Banking</span>
    <span class="method-chip">Wallets</span>
  </div>
</div>

<script>
  const amountEl = document.getElementById('amount');
  const displayEl = document.getElementById('amountDisplay');

  amountEl.addEventListener('input', () => {
    const val = parseInt(amountEl.value, 10);
    if (val > 0) {
      displayEl.textContent = '₹' + val.toLocaleString('en-IN');
    } else {
      displayEl.textContent = '';
    }
  });

  async function submitPayment() {
    const btn = document.getElementById('payBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    const amount     = parseInt(document.getElementById('amount').value, 10);
    const name       = document.getElementById('name').value.trim();
    const phone      = document.getElementById('phone').value.trim().replace(/\D/g, '');
    const email      = document.getElementById('email').value.trim();
    const note       = document.getElementById('note').value.trim();
    const handled_by = document.getElementById('handled_by').value.trim();

    if (!amount || amount < 1) return showError('Please enter an amount.');
    if (!name) return showError('Please enter your name.');
    if (!phone || phone.length < 10) return showError('Please enter a valid mobile number.');
    if (email && !email.includes('@')) return showError('Please enter a valid email address.');

    btn.disabled = true;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="animation:spin 0.8s linear infinite"><circle cx="7" cy="7" r="5.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><path d="M7 1.5A5.5 5.5 0 0 1 12.5 7" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg> Creating link…`;

    try {
      const res = await fetch('/api/custom-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, name, phone, email, note, handled_by }),
      });
      const data = await res.json();
      if (!res.ok || !data.url) throw new Error(data.error || 'Could not create payment link.');
      window.location.href = data.url;
    } catch (e) {
      showError(e.message);
      btn.disabled = false;
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L13 7L7 13M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Pay Now`;
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') submitPayment(); });
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
