<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Moon Festival — Yoga & Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; background:#0e0a06; font-family:'Josefin Sans',sans-serif; }
.slide { width:1080px; height:1350px; display:flex; flex-direction:column; }
.header { display:flex; flex-direction:column; align-items:center; padding:52px 60px 32px; flex-shrink:0; }
.cat { font-size:38px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#EDD4B2; text-align:center; line-height:1.1; }
.line { width:60px; height:2px; background:#A85828; margin-top:18px; opacity:0.8; }
.cards { flex:1; padding:0 16px; display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr 1fr; gap:3px; overflow:hidden; }
.card { position:relative; border-radius:8px; overflow:hidden; background:#1a1208; }
.photo { position:absolute; inset:0; background-size:cover; background-repeat:no-repeat; }
.overlay { position:absolute; inset:0; background:rgba(10,7,2,0.45); }
.info { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.9rem 0.9rem 0.8rem; text-align:center; }
/* Order: role (bold) → name (dimmed) → city (terracotta) */
.c-role { font-size:17px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#EDD4B2; margin-bottom:0.4rem; line-height:1.2; }
.c-name { font-size:11px; font-weight:400; letter-spacing:0.18em; text-transform:uppercase; color:rgba(237,212,178,0.65); margin-bottom:0.45rem; display:block; }
.c-city { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#B06030; }
</style>
</head>
<body>
<button id="dl" onclick="savePng()" style="position:fixed;top:16px;right:16px;z-index:999;background:#A85828;border:none;color:#EDD4B2;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 20px;border-radius:6px;cursor:pointer;">&#11015; Save PNG</button>
<div class="slide" id="slide">
  <div class="header">
    <div class="cat">Yoga &amp; Fitness</div>
    
    <div class="line"></div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Pradeesh 3.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Yoga</div>
        <div class="c-name">Pradesh Raj</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/varun 4.jpg');background-position:50% 30%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Hatha Yoga</div>
        <div class="c-name">Varun</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Kalari Mobility Tre.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Mobility via Kalari</div>
        <div class="c-name">Tre</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/pooja 2.jpg');background-position:50% 40%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Mat Pilates</div>
        <div class="c-name">Pooja</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/tre 2.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Kalaripayattu</div>
        <div class="c-name">Tre</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Animal Flow 2 Vipindas.jpeg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Animal Flow</div>
        <div class="c-name">Vipindas</div>
        <div class="c-city">Bangalore</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/hinoki.jpg');background-position:50% 35%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Tai Chi &amp; Qi Gong</div>
        <div class="c-name">Hinoki</div>
        <div class="c-city">Goa</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Aerial sonia 5.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-role">Aerial Yoga</div>
        <div class="c-name">Sonia</div>
        <div class="c-city">Goa</div>
      </div>
    </div>
    <div class="card" style="background:transparent;visibility:hidden;"></div>
  </div>
</div>
<script>
async function savePng() {
  const btn = document.getElementById('dl');
  btn.textContent = 'Rendering…';
  btn.disabled = true;
  const canvas = await html2canvas(document.getElementById('slide'), {
    width: 1080, height: 1350, scale: 1,
    useCORS: true, backgroundColor: '#0e0a06', logging: false
  });
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '01-yoga.png';
    a.click();
    btn.textContent = '✓ Saved';
    setTimeout(() => { btn.textContent = '⬇ Save PNG'; btn.disabled = false; }, 2000);
  }, 'image/png');
}
</script>
</body>
</html>
