<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Moon Festival — Talks</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; background:#0e0a06; font-family:'Josefin Sans',sans-serif; }
.slide { width:1080px; height:1350px; display:flex; flex-direction:column; }
.header { display:flex; flex-direction:column; align-items:center; padding:52px 60px 32px; flex-shrink:0; }
.brand { font-size:13px; letter-spacing:0.28em; color:#C46830; text-transform:uppercase; margin-bottom:10px; }
.cat { font-size:46px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#EDD4B2; text-align:center; line-height:1.1; }
.line { width:60px; height:2px; background:#A85828; margin-top:18px; opacity:0.8; }
.cards { flex:1; padding:0 16px; display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr; gap:10px; overflow:hidden; }
.card { position:relative; border-radius:8px; overflow:hidden; background:#1a1208; }
.photo { position:absolute; inset:0; background-size:cover; background-repeat:no-repeat; }
.overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(10,6,2,0.92) 0%, rgba(10,6,2,0.55) 45%, rgba(10,6,2,0.1) 100%); }
.info { position:absolute; bottom:0; left:0; right:0; padding:18px 16px 20px; }
.name { font-size:26px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#EDD4B2; line-height:1.1; margin-bottom:4px; }
.role { font-size:15px; color:rgba(237,212,178,0.72); letter-spacing:0.04em; margin-bottom:4px; line-height:1.3; }
.city { font-size:12px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#C46830; }
.footer { display:flex; align-items:center; justify-content:space-between; padding:14px 36px 22px; flex-shrink:0; }
.fl { font-size:12px; letter-spacing:0.22em; color:rgba(237,212,178,0.3); text-transform:uppercase; }
.fm { font-size:11px; letter-spacing:0.14em; color:rgba(237,212,178,0.3); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="brand">Moon Festival 2026 &middot; Goa</div>
    <div class="cat">Talks</div>
    
    <div class="line"></div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Kanchan 2.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info" style="padding:18px 16px 20px">
        <div class="name" style="font-size:26px">Dr. Kanchan</div>
        <div class="role" style="font-size:15px">Ayurveda</div>
        <div class="city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/varun 2.jpg');background-position:50% 30%;"></div>
      <div class="overlay"></div>
      <div class="info" style="padding:18px 16px 20px">
        <div class="name" style="font-size:26px">Varun</div>
        <div class="role" style="font-size:15px">Meditation &amp; the Mind</div>
        <div class="city">Mumbai</div>
      </div>
    </div>
    <div class="card" style="background:transparent;visibility:hidden;"></div>
  </div>
  <div class="footer">
    <div class="fl">moonfestival.in</div>
    <div class="fm">8 / 8</div>
    <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><path d="M14 2 C8 2 3 7 3 14 C3 21 8 26 14 26 C18 26 22 24 24 20 C22 21 19 21.5 16 20 C10 17 8 10 11 5 C12 3.5 13 2.5 14 2Z" fill="#EDD4B2" opacity="0.35"/></svg>
  </div>
</div>
</body>
</html>
