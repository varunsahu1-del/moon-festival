<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Moon Festival — Music, Singing & Kirtan</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; background:#0e0a06; font-family:'Josefin Sans',sans-serif; }
.slide { width:1080px; height:1350px; display:flex; flex-direction:column; }
.header { display:flex; flex-direction:column; align-items:center; padding:52px 60px 32px; flex-shrink:0; }
.cat { font-size:38px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#EDD4B2; text-align:center; line-height:1.1; }
.line { width:60px; height:2px; background:#A85828; margin-top:18px; opacity:0.8; }
.cards { flex:1; padding:0 16px; display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr 1fr; gap:10px; overflow:hidden; }
.card { position:relative; border-radius:8px; overflow:hidden; background:#1a1208; }
.photo { position:absolute; inset:0; background-size:cover; background-repeat:no-repeat; }
.overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(10,7,2,0.88) 0%, rgba(10,7,2,0.35) 50%, transparent 100%); }
.info { position:absolute; bottom:0; left:0; right:0; padding:0.9rem 0.9rem 0.8rem; }
/* Match website exactly: name=light/dimmed, role=bold/bright, city=terracotta */
.c-name { font-size:11px; font-weight:400; letter-spacing:0.18em; text-transform:uppercase; color:rgba(237,212,178,0.65); margin-bottom:0.2rem; display:block; }
.c-role { font-size:17px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#EDD4B2; margin-bottom:0.45rem; line-height:1.2; }
.c-city { font-size:11px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#B06030; }
.footer { display:flex; align-items:center; justify-content:space-between; padding:14px 36px 22px; flex-shrink:0; }
.fl { font-size:12px; letter-spacing:0.22em; color:rgba(237,212,178,0.3); text-transform:uppercase; }
.fm { font-size:11px; letter-spacing:0.14em; color:rgba(237,212,178,0.3); }
</style>
</head>
<body>
<button id="dl" onclick="savePng()" style="position:fixed;top:16px;right:16px;z-index:999;background:#A85828;border:none;color:#EDD4B2;font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 20px;border-radius:6px;cursor:pointer;">&#11015; Save PNG</button>
<div class="slide" id="slide">
  <div class="header">
    <div class="cat">Music, Singing<br>&amp; Kirtan</div>
    
    <div class="line"></div>
  </div>
  <div class="cards">
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/vicky 2.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Gouranga's</div>
        <div class="c-role">Soul Kirtan</div>
        <div class="c-city">Goa</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/aditya.jpg');background-position:50% 40%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Aditya</div>
        <div class="c-role">Drum Circle &amp; Afro Jam</div>
        <div class="c-city">Mumbai</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/anoushaw 2.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Anoushaw</div>
        <div class="c-role">Sufi &amp; Classical Singing</div>
        <div class="c-city">Pune</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Nad MAndala Kirtan.jpeg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Nad Mandala</div>
        <div class="c-role">Kirtan</div>
        <div class="c-city">International</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/MArtin Throat Singing.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Martin</div>
        <div class="c-role">Throat Singing</div>
        <div class="c-city">France</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/Voice Activation - Leonie & Lauren.jpeg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Leonie &amp; Lauren</div>
        <div class="c-role">Voice Activation</div>
        <div class="c-city">International</div>
      </div>
    </div>
    <div class="card">
      <div class="photo" style="background-image:url('../Facilitator Photos/ananda flow 2.jpg');background-position:50% 25%;"></div>
      <div class="overlay"></div>
      <div class="info">
        <div class="c-name">Ananda Flow</div>
        <div class="c-role">Kirtan</div>
        <div class="c-city">London</div>
      </div>
    </div>
    <div class="card" style="background:transparent;visibility:hidden;"></div>
    <div class="card" style="background:transparent;visibility:hidden;"></div>
  </div>
  <div class="footer">
    <div class="fl">moonfestival.in</div>
    <div class="fm">5 / 8</div>
    <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><path d="M14 2 C8 2 3 7 3 14 C3 21 8 26 14 26 C18 26 22 24 24 20 C22 21 19 21.5 16 20 C10 17 8 10 11 5 C12 3.5 13 2.5 14 2Z" fill="#EDD4B2" opacity="0.35"/></svg>
  </div>
</div>
<script>
async function savePng() {
  const btn = document.getElementById('dl');
  btn.textContent = 'Rendering…';
  btn.disabled = true;
  const canvas = await html2canvas(document.getElementById('slide'), {
    width: 1080, height: 1350, scale: 1,
    useCORS: true, backgroundColor: '#0e0a06', logging: false
  });
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '05-music.png';
    a.click();
    btn.textContent = '✓ Saved';
    setTimeout(() => { btn.textContent = '⬇ Save PNG'; btn.disabled = false; }, 2000);
  }, 'image/png');
}
</script>
</body>
</html>
