  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --ink: #191406; --ink-2: #191406; }
    /* ── PRICING TABLE ─────────────────────────────────── */
    .pricing-wrap {
      background: var(--ink);
      padding: var(--s-10) 0 var(--s-16);
    }

    .pricing-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .venue-block {
      margin-bottom: 0;
      border-bottom: 0.5px solid rgba(237,212,178,0.08);
    }
    .venue-block:last-child { border-bottom: none; }
    #pricingContent .venue-block:nth-last-child(2) { border-bottom: none; }

    .venue-block-toggle {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      gap: 1rem;
      text-align: left;
    }
    .venue-block-toggle:hover .venue-block-label { color: #C47D52; }

    .venue-block-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #B06030;
      display: flex;
      align-items: baseline;
      gap: 0.6em;
      transition: color 0.15s;
    }

    .venue-block-note {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: none;
      color: rgba(237,212,178,0.4);
    }

    @media (max-width: 600px) {
      .venue-block-label {
        flex-direction: column;
        gap: 0.2em;
      }
      .venue-block-sep { display: none; }
    }

    .venue-chevron {
      flex-shrink: 0;
      color: rgba(176,96,48,0.5);
      transition: transform 0.25s ease;
    }
    .venue-block.open .venue-chevron { transform: rotate(180deg); }

    .venue-block-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.32s ease;
    }
    .venue-block.open .venue-block-body {
      max-height: 1200px;
    }
    .venue-block-body-inner {
      padding-bottom: 20px;
    }

    .pricing-table {
      width: 100%;
      border-collapse: collapse;
    }

    /* Vertical column dividers */
    .pricing-table thead th,
    .pricing-table td {
      border-right: 0.5px solid rgba(176,96,48,0.13);
    }
    .pricing-table thead th:last-child,
    .pricing-table td:last-child { border-right: none; }

    /* Header row */
    .pricing-table thead th {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(237,212,178,0.38);
      padding: 12px 16px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(237,212,178,0.1);
      white-space: nowrap;
    }
    .pricing-table thead th:first-child { text-align: left; }
    .pricing-table thead th.th-active {
      color: #B06030;
      background: rgba(176,96,48,0.07);
    }

    /* Body rows */
    .pricing-table tbody tr {
      border-bottom: 0.5px solid rgba(237,212,178,0.07);
      transition: background 0.12s;
    }
    .pricing-table tbody tr:last-child { border-bottom: none; }
    .pricing-table tbody tr:hover { background: rgba(176,96,48,0.03); }

    .pricing-table td { padding: 18px 16px; vertical-align: middle; }
    .pricing-table td.td-active-col { background: rgba(176,96,48,0.05); }

    /* Room name */
    .td-room {
      color: #EDD4B2;
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
      font-size: 0.97rem;
    }
    .td-note {
      display: block;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.71rem;
      color: rgba(237,212,178,0.38);
      margin-top: 3px;
      font-weight: 300;
    }

    /* Future phase prices — recede */
    .td-price {
      text-align: right;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.87rem;
      color: rgba(237,212,178,0.32);
      font-weight: 400;
      white-space: nowrap;
    }
    /* Early Bird — hero price */
    .td-price.active-price {
      font-size: 1.18rem;
      font-weight: 700;
      color: #EDD4B2;
      letter-spacing: -0.01em;
    }
    /* Add-on column */
    .td-price.td-addon {
      color: #B06030;
      font-size: 0.87rem;
      font-weight: 600;
    }

    .savings-pill {
      display: inline-block;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
      background: none;
      color: #C07040;
      padding: 0;
      margin-top: 6px;
      opacity: 0.85;
    }

    .gst-note {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.63rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.4);
      text-align: center;
      margin-top: var(--s-10);
      padding-top: var(--s-4);
      border-top: 0.5px solid rgba(237,212,178,0.08);
      line-height: 2.2;
    }
    .gst-note strong { color: rgba(237,212,178,0.65); font-weight: 400; }

    @media (max-width: 560px) {
      .pricing-table thead th,
      .pricing-table td { padding: 10px 8px; }
      .td-price { font-size: 0.72rem; }
      .td-price.active-price { font-size: 0.92rem; }
      .savings-pill { display: none; }
    }
  </style>
</head>
<body>

<!-- ── NAV DRAWER ──────────────────────────────────────── -->
<!-- NAV -->
<!-- ── HERO ─────────────────────────────────────────────── -->
<div class="schedule-hero-content" style="padding-top: calc(var(--s-24) + 90px); padding-bottom: var(--s-16); background: #7A3A18;">
  <h1 class="schedule-hero-title" style="color: #EDD4B2 !important;">Pricing</h1>
  <p class="schedule-hero-sub">Phase 2</p>
</div>
<div style="background: var(--ink); text-align: center; padding: var(--s-6) var(--pad);">
  <p id="currentPhaseLabel" style="font-family:'Josefin Sans',sans-serif;font-size:0.88rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#EDD4B2;margin:0 0 0.5rem;">Phase 2 Ends 30 September</p>

  <!-- Countdown timer -->
  <div id="eb-countdown-block" style="display:none;margin-top:1.4rem;">
    <div style="display:flex;align-items:flex-start;justify-content:center;gap:0.5rem;">
      <div class="cd-unit"><span class="cd-num" id="cd-days">00</span><span class="cd-label">Days</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><span class="cd-num" id="cd-hours">00</span><span class="cd-label">Hours</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><span class="cd-num" id="cd-mins">00</span><span class="cd-label">Mins</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><span class="cd-num" id="cd-secs">00</span><span class="cd-label">Secs</span></div>
    </div>
  </div>


  <style>
    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .cd-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(52px, 10vw, 70px);
      height: clamp(52px, 10vw, 70px);
      background: rgba(176,96,48,0.15);
      border: 1px solid rgba(176,96,48,0.35);
      border-radius: 6px;
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 700;
      color: #EDD4B2;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .cd-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.4);
    }
    .cd-sep {
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 700;
      color: rgba(176,96,48,0.5);
      margin-top: clamp(10px, 2vw, 16px);
      line-height: 1;
    }
  </style>

  <script>
    (function(){
      const end = new Date('2026-10-01T00:00:00');
      const block = document.getElementById('eb-countdown-block');

      function update() {
        const diff = end - new Date();
        if (diff <= 0) { block.style.display = 'none'; return; }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.getElementById('cd-days').textContent  = String(d).padStart(2,'0');
        document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
        document.getElementById('cd-mins').textContent  = String(m).padStart(2,'0');
        document.getElementById('cd-secs').textContent  = String(s).padStart(2,'0');
        block.style.display = 'block';
      }

      update();
      setInterval(update, 1000);
    })();
  </script>
</div>

<!-- ── PRICING TABLES ────────────────────────────────────── -->
<div class="pricing-wrap">
  <div class="pricing-inner" id="pricingContent">
    <!-- injected by JS -->
  </div>
</div>

<!-- ── FOOTER ────────────────────────────────────────────── -->
<!-- FOOTER -->

<script>
// FALLBACK ONLY — prices are overwritten at runtime from /api/public/pricing before render.
// Do not rely on these values being current; edit inventory.js on the server instead.
const PRICING = {
  'Bhakti Kutir': {
    notes: 'Non-AC · Eco Retreat · Festival Favourite',
    rooms: [
      { name: 'Triple Sharing', note: '1 bed in a 3-bed room',   phase2: 31000, phase3: 32500, phase4: 34000, extraDay: 1500 },
      { name: 'Double Sharing', note: '1 bed in a 2-bed room',   phase2: 36000, phase3: 37500, phase4: 39000, extraDay: 2500 },
      { name: 'Private Room',   note: 'Entire room for yourself', phase2: 48000, phase3: 49500, phase4: 51000, extraDay: 3000 },
    ]
  },
  'Bhakti Dorm': {
    notes: 'Non-AC · Eco Retreat · Festival Venue',
    rooms: [
      { name: '4 Bed Dorm', note: '4-bed dorm · females only', phase2: 27000, phase3: 28500, phase4: 30000, extraDay: 800 },
      { name: '6 Bed Dorm', note: '6-bed dorm · mixed',        phase2: 25500, phase3: 27000, phase4: 28500, extraDay: 700 },
    ]
  },
  'Destiny': {
    notes: '1 min walk · AC · Luxury · Plunge Pool · Beach Access',
    rooms: [
      { name: 'Double Sharing', note: '1 bed in a 2-bed room',   phase2: 56500, phase3: 58000, phase4: 59500, extraDay: 7000  },
      { name: 'Private Room',   note: 'Entire room for yourself', phase2: 83400, phase3: 84900, phase4: 86400, extraDay: 12000 },
    ]
  },
  'Ourem Palace': {
    notes: '3 mins walk · AC · Partial Sea View',
    rooms: [
      { name: 'Double Sharing', note: '1 bed in a 2-bed heritage room', phase2: 46000, phase3: 47500, phase4: 49000, extraDay: 3500 },
      { name: 'Private Room',   note: 'Entire room for yourself',        phase2: 60400, phase3: 61900, phase4: 63400, extraDay: 6000 },
    ]
  },
  'Teraria': {
    notes: '6 mins walk · AC · Cosy · Best Value',
    rooms: [
      { name: 'Double Sharing', note: '1 bed in a 2-bed room',   phase2: 33500, phase3: 35000, phase4: 36500, extraDay: 3000 },
      { name: 'Private Room',   note: 'Entire room for yourself', phase2: 46600, phase3: 48100, phase4: 49600, extraDay: 4500 },
    ]
  },
  'Marron · Sea View': {
    notes: '4 mins walk · AC · Luxury · Sea Facing',
    rooms: [
      { name: 'Double Sharing', note: '1 bed in a 2-bed room',   phase2: 51400, phase3: 52900, phase4: 54400, extraDay: 4500 },
      { name: 'Private Room',   note: 'Entire room for yourself', phase2: 73400, phase3: 74900, phase4: 76400, extraDay: 8500 },
    ]
  },
  'Marron · Garden': {
    notes: '4 mins walk · AC · Luxury · Beach Access',
    rooms: [
      { name: 'Double Sharing', note: '1 bed in a 2-bed room',   phase2: 41000, phase3: 42500, phase4: 44000, extraDay: 3500 },
      { name: 'Private Room',   note: 'Entire room for yourself', phase2: 56400, phase3: 57900, phase4: 59400, extraDay: 6500 },
    ]
  },
};

const PHASE_LABELS = { phase2: 'Phase 2 Ends 30 September', phase3: 'Phase 3 Ends 31 October', phase4: 'Phase 4' };

function fmt(n) { return '₹' + n.toLocaleString('en-IN'); }

function savings(active, phase2) {
  if (active >= phase2) return '';
  const saved = phase2 - active;
  return `<span class="savings-pill">Save ₹${saved.toLocaleString('en-IN')}</span>`;
}

async function render() {
  let phase = 'phase2';
  try {
    const r = await fetch('/api/public/pricing');
    if (r.ok) {
      const d = await r.json();
      phase = d.phase || 'earlyBird';
      // Overwrite hardcoded prices with live values from the API
      // API returns active/phase4 only — hardcoded phase values are authoritative
    }
  } catch {}

  document.getElementById('currentPhaseLabel').textContent = PHASE_LABELS[phase] || phase;

  const content = document.getElementById('pricingContent');
  let html = `<div style="text-align:center;padding:1rem 0 2rem;"><a href="tickets.html#booking-section" style="display:inline-block;font-family:'Josefin Sans',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#ffffff;background:#B06030;text-decoration:none;padding:0.85rem 2.2rem;border-radius:3px;transition:background 0.2s;" onmouseover="this.style.background='#C47D52'" onmouseout="this.style.background='#B06030'">Get Tickets</a></div>`;

  const venueEntries = Object.entries(PRICING);
  let isFirst = true;
  for (let vi = 0; vi < venueEntries.length; vi++) {
    const [venue, data] = venueEntries[vi];
    const openClass = isFirst ? 'open' : '';
    const isLast = vi === venueEntries.length - 1;
    html += `
    <div class="venue-block ${openClass}"${isLast ? ' style="border-bottom:none;"' : ''}>
      <button class="venue-block-toggle" onclick="toggleVenue(this)">
        <span class="venue-block-label">${venue}<span class="venue-block-note"><span class="venue-block-sep"> · </span>${data.notes}</span></span>
        <svg class="venue-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="venue-block-body">
        <div class="venue-block-body-inner">
          <table class="pricing-table">
            <thead>
              <tr>
                <th>Room Type</th>
                <th class="${phase === 'phase2' ? 'th-active' : ''}">Phase 2</th>
                <th class="${phase === 'phase3' ? 'th-active' : ''}">Phase 3</th>
                <th class="${phase === 'phase4' ? 'th-active' : ''}">Phase 4</th>
              </tr>
            </thead>
            <tbody>`;

    for (const r of data.rooms) {
      html += `
              <tr>
                <td class="td-room">${r.name}<span class="td-note">${r.note}</span></td>
                <td class="td-price ${phase === 'phase2' ? 'active-price td-active-col' : ''}"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${fmt(r.phase2)}${phase === 'phase2' ? savings(r.phase2, r.phase4) : ''}</div></td>
                <td class="td-price ${phase === 'phase3' ? 'active-price td-active-col' : ''}"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${fmt(r.phase3)}${phase === 'phase3' ? savings(r.phase3, r.phase4) : ''}</div></td>
                <td class="td-price ${phase === 'phase4' ? 'active-price td-active-col' : ''}">${fmt(r.phase4)}</td>
              </tr>`;
    }

    html += `</tbody></table></div></div></div>`;
    isFirst = false;
  }

  const festivalPasses = [
    { name: '3-Day Pass', note: '27–29 Nov · all workshops, ceremonies, music &amp; talks', phase2: 19000, phase3: 20000, phase4: 21000 },
    { name: 'Day Pass',   note: 'Single day · 27, 28, or 29 Nov',                           phase2: 7000,  phase3: 7500,  phase4: 8000  },
  ];

  html += `
  <div class="venue-block" style="display:none;border:none;">
    <button class="venue-block-toggle" onclick="toggleVenue(this)">
      <span class="venue-block-label">Festival Access<span class="venue-block-note"> · no stay or meals</span></span>
      <svg class="venue-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="venue-block-body">
      <div class="venue-block-body-inner">
        <table class="pricing-table">
          <thead>
            <tr>
              <th>Ticket</th>
              <th class="${phase === 'phase2' ? 'th-active' : ''}">Phase 2</th>
              <th class="${phase === 'phase3' ? 'th-active' : ''}">Phase 3</th>
              <th class="${phase === 'phase4' ? 'th-active' : ''}">Phase 4</th>
            </tr>
          </thead>
          <tbody>
            ${festivalPasses.map(p => `
            <tr>
              <td class="td-room">${p.name}<span class="td-note">${p.note}</span></td>
              <td class="td-price ${phase === 'phase2' ? 'active-price td-active-col' : ''}"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${fmt(p.phase2)}${phase === 'phase2' ? savings(p.phase2, p.phase4) : ''}</div></td>
              <td class="td-price ${phase === 'phase3' ? 'active-price td-active-col' : ''}"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${fmt(p.phase3)}${phase === 'phase3' ? savings(p.phase3, p.phase4) : ''}</div></td>
              <td class="td-price ${phase === 'phase4' ? 'active-price td-active-col' : ''}">${fmt(p.phase4)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

  html += `<p class="gst-note"><strong>+5% GST</strong> added at checkout &nbsp;·&nbsp; All prices are per person &nbsp;·&nbsp; <strong>Phase 2</strong> pricing ends 30 September.</p>`;
  content.innerHTML = html;
}

render();

/* ── NAV TOGGLE ── */
const navToggle = document.getElementById('navToggle');
const navDrawer = document.getElementById('navDrawer');
navToggle.addEventListener('click', () => {
  const isOpen = navDrawer.classList.toggle('open');
  navToggle.classList.toggle('open', isOpen);
  navToggle.setAttribute('aria-expanded', isOpen);
  navDrawer.setAttribute('aria-hidden', !isOpen);
});
navDrawer.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    navDrawer.classList.remove('open');
    navToggle.classList.remove('open');
    navToggle.setAttribute('aria-expanded', false);
    navDrawer.setAttribute('aria-hidden', true);
  });
});
/* ── NAV DROPDOWN ── */
document.querySelectorAll('.nav-dropdown').forEach(dropdown => {
  const btn = dropdown.querySelector('.nav-dropdown-toggle');
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = dropdown.classList.toggle('open');
    document.querySelectorAll('.nav-dropdown').forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.nav-dropdown').forEach(d => d.classList.remove('open'));
});

function toggleVenue(btn) {
  btn.closest('.venue-block').classList.toggle('open');
}
</script>
</body>
</html>
