<script>
(function() {
  var drawer = document.getElementById('navDrawer');
  if (!drawer || drawer.dataset.accordionInit) return;
  drawer.dataset.accordionInit = '1';

  // Accordion toggle
  drawer.querySelectorAll('.drawer-accordion-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var panel = btn.nextElementSibling;
      var isOpen = btn.classList.toggle('open');
      panel.classList.toggle('open', isOpen);
      drawer.querySelectorAll('.drawer-accordion-toggle').forEach(function(other) {
        if (other !== btn) { other.classList.remove('open'); other.nextElementSibling.classList.remove('open'); }
      });
    });
  });

  // Active page highlight
  var page = location.pathname.split('/').pop() || 'index.html';
  drawer.querySelectorAll('a[href]').forEach(function(a) {
    if (a.getAttribute('href') === page) {
      a.classList.add('active');
      // Open parent accordion if sub-item
      var panel = a.closest('.drawer-accordion-panel');
      if (panel) {
        panel.classList.add('open');
        var toggle = panel.previousElementSibling;
        if (toggle) toggle.classList.add('open', 'active');
      }
    }
  });
})();
</script>
