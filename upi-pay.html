<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="Favicons/Yellow Transparency.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Payment — Moon Festival 2026</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #191406; min-height: 100svh; display: flex; flex-direction: column; }

    .upi-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem var(--pad);
    }

    .upi-card {
      width: 100%;
      max-width: 440px;
      background: rgba(237,212,178,0.04);
      border: 0.5px solid rgba(237,212,178,0.1);
      border-radius: 12px;
      padding: 2.2rem 2rem;
    }

    .upi-eyebrow {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #B06030;
      margin-bottom: 0.5rem;
    }

    .upi-heading {
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #EDD4B2;
      margin: 0 0 0.25rem;
    }

    .upi-ref {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.78rem;
      color: rgba(237,212,178,0.4);
      margin-bottom: 2rem;
    }

    /* Step row */
    .upi-steps { display: flex; flex-direction: column; gap: 1.4rem; margin-bottom: 2rem; }

    .upi-step { display: flex; gap: 1rem; align-items: flex-start; }

    .upi-step-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 0.5px solid rgba(176,96,48,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: #B06030;
      margin-top: 1px;
    }

    .upi-step-body { flex: 1; }

    .upi-step-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.4);
      margin-bottom: 0.45rem;
    }

    /* Amount display */
    .upi-amount-box {
      background: rgba(176,96,48,0.08);
      border: 0.5px solid rgba(176,96,48,0.2);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .upi-amount-num {
      font-family: 'Open Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #EDD4B2;
      letter-spacing: -0.02em;
    }
    .upi-amount-gst {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.68rem;
      color: rgba(237,212,178,0.4);
    }

    /* UPI ID box */
    .upi-id-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(237,212,178,0.05);
      border: 0.5px solid rgba(237,212,178,0.12);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
    }
    .upi-id-text {
      flex: 1;
      min-width: 0;
      font-family: 'Open Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #EDD4B2;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upi-copy-btn {
      flex-shrink: 0;
      background: rgba(176,96,48,0.15);
      border: 0.5px solid rgba(176,96,48,0.3);
      border-radius: 4px;
      color: #C07040;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.28rem 0.55rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upi-copy-btn:hover { background: rgba(176,96,48,0.25); }

    /* Open app button */
    .upi-open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: auto;
      padding: 0.7rem;
      background: rgba(176,96,48,0.15);
      border: 0.5px solid rgba(176,96,48,0.35);
      border-radius: 8px;
      color: #EDD4B2;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upi-open-btn:hover { background: rgba(176,96,48,0.25); }

    /* Screenshot upload */
    .upi-upload-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(237,212,178,0.03);
      border: 0.5px dashed rgba(237,212,178,0.18);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upi-upload-label.has-file {
      border-color: rgba(176,96,48,0.5);
      background: rgba(176,96,48,0.05);
    }
    .upi-upload-label.error {
      border-color: #B06030;
      background: rgba(176,96,48,0.08);
    }
    .upi-upload-text {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.75rem;
      color: rgba(237,212,178,0.45);
    }
    .upi-upload-label.has-file .upi-upload-text { color: #C07040; }
    .upi-upload-label.error .upi-upload-text { color: #C07040; }

    .upi-submit-btn {
      width: 100%;
      padding: 0.8rem;
      background: #B06030;
      border: none;
      border-radius: 8px;
      color: #EDD4B2;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upi-submit-btn:hover { background: #C07040; }
    .upi-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .upi-divider {
      height: 0.5px;
      background: rgba(237,212,178,0.08);
      margin: 1.6rem 0;
    }
  </style>
</head>
<body>

<nav class="nav scrolled" id="mainNav">
  <a href="index.html" class="nav-logo"><span class="logo-moon">MOON</span><span class="logo-fest">FESTIVAL</span></a>
</nav>

<div class="upi-wrap">
  <div class="upi-card">
    <div class="upi-eyebrow">UPI Transfer</div>
    <h1 class="upi-heading">Complete Payment</h1>
    <p class="upi-ref" id="pageRef">—</p>

    <div class="upi-steps">

      <!-- Step 1: Amount -->
      <div class="upi-step">
        <div class="upi-step-num">1</div>
        <div class="upi-step-body">
          <div class="upi-step-label">Send this exact amount</div>
          <div class="upi-amount-box">
            <span class="upi-amount-num" id="pageAmount">—</span>
            <span class="upi-amount-gst">incl. 5% GST</span>
          </div>
        </div>
      </div>

      <!-- Step 2: Open UPI app -->
      <div class="upi-step">
        <div class="upi-step-num">2</div>
        <div class="upi-step-body">
          <div class="upi-step-label">Open your UPI app</div>
          <div id="appButtons" style="display:flex;flex-wrap:wrap;gap:0.4rem;">
            <a id="gpayBtn" href="#" style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.38rem 0.6rem;border:1px solid #4285F4;border-radius:4px;color:#4285F4;font-family:'Open Sans',sans-serif;font-size:0.72rem;text-decoration:none;background:rgba(237,212,178,0.04);white-space:nowrap;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google Pay
            </a>
            <a id="phonepeBtn" href="#" style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.38rem 0.6rem;border:1px solid #5f259f;border-radius:4px;color:#a78bfa;font-family:'Open Sans',sans-serif;font-size:0.72rem;text-decoration:none;background:rgba(237,212,178,0.04);white-space:nowrap;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#a78bfa" stroke-width="1.5"/><path d="M9 8h4c1.1 0 2 .9 2 2s-.9 2-2 2H9V8zm0 4h5l2 4H9v-4z" fill="#a78bfa"/></svg>
              PhonePe
            </a>
            <a id="paytmBtn" href="#" style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.38rem 0.6rem;border:1px solid #002970;border-radius:4px;color:#60a5fa;font-family:'Open Sans',sans-serif;font-size:0.72rem;text-decoration:none;background:rgba(237,212,178,0.04);white-space:nowrap;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#60a5fa" stroke-width="1.5"/><path d="M7 12h10M12 7v10" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/></svg>
              Paytm
            </a>
          </div>
          <p id="desktopNote" style="display:none;font-family:'Open Sans',sans-serif;font-size:0.78rem;color:rgba(237,212,178,0.45);line-height:1.6;margin:0;"></p>
        </div>
      </div>

      <!-- Step 3: Screenshot -->
      <div class="upi-step">
        <div class="upi-step-num">3</div>
        <div class="upi-step-body">
          <div class="upi-step-label">Upload payment screenshot <span style="color:#B06030;">*</span></div>
          <label class="upi-upload-label" id="uploadLabel">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;opacity:0.5;"><path d="M2 13 L5.5 9 L8 12 L11 9.5 L16 13Z" stroke="#EDD4B2" stroke-width="1" fill="none" stroke-linejoin="round"/><rect x="1.5" y="2" width="15" height="12" rx="1.5" stroke="#EDD4B2" stroke-width="1" fill="none"/><circle cx="13" cy="5.5" r="1.2" stroke="#EDD4B2" stroke-width="0.8" fill="none"/></svg>
            <span class="upi-upload-text" id="uploadText">Tap to upload payment screenshot</span>
            <input id="screenshotInput" type="file" accept="image/*" style="display:none;" onchange="onFileChange()" />
          </label>
        </div>
      </div>

    </div>

    <button class="upi-submit-btn" onclick="submitPayment()">Complete Booking</button>
    <a onclick="history.back(); return false;" href="#" style="display:block;margin-top:1.2rem;font-family:'Open Sans',sans-serif;font-size:0.75rem;font-weight:300;color:#B06030;text-decoration:none;text-align:center;">← Back</a>
  </div>

</div>

<script>
  const params = new URLSearchParams(location.search);
  const bookingRef = params.get('ref');
  const amount    = params.get('amount');

  document.getElementById('pageRef').textContent = bookingRef ? 'Booking ' + bookingRef : '';
  document.getElementById('pageAmount').textContent = amount
    ? '₹' + Number(amount).toLocaleString('en-IN')
    : '—';

  function setUpiLinks(vpa) {
    const note = encodeURIComponent('Moon Festival Ticket Fee' + (bookingRef ? ' - ' + bookingRef : ''));
    const baseParams = `pa=${encodeURIComponent(vpa)}&pn=${encodeURIComponent('Moon Festival')}&am=${amount || ''}&tn=${note}&cu=INR`;
    document.getElementById('gpayBtn').href = `tez://upi/pay?${baseParams}`;
    document.getElementById('phonepeBtn').href = `phonepe://pay?${baseParams}`;
    document.getElementById('paytmBtn').href = `paytmmp://pay?${baseParams}`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (!isMobile) {
      document.getElementById('appButtons').style.display = 'none';
      const note = document.getElementById('desktopNote');
      note.textContent = 'Open GPay or PhonePe on your phone to complete payment.';
      note.style.display = 'block';
    }
  }

  fetch('/api/bookings/public-config')
    .then(r => r.json())
    .then(cfg => setUpiLinks(cfg.upi_vpa || 'moonholisticfestival@upi'))
    .catch(() => setUpiLinks('moonholisticfestival@upi'));

  function onFileChange() {
    const file = document.getElementById('screenshotInput').files[0];
    const label = document.getElementById('uploadLabel');
    const text  = document.getElementById('uploadText');
    if (file) {
      label.classList.remove('error');
      label.classList.add('has-file');
      text.textContent = file.name;
    }
  }

  async function submitPayment() {
    const file = document.getElementById('screenshotInput').files[0];
    if (!file) {
      const label = document.getElementById('uploadLabel');
      const text  = document.getElementById('uploadText');
      label.classList.add('error');
      text.textContent = 'Please upload your payment screenshot to continue';
      return;
    }

    const btn = document.querySelector('.upi-submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      // Upload screenshot
      const fd = new FormData();
      fd.append('booking_ref', bookingRef);
      fd.append('screenshot', file);
      await fetch('/api/bookings/upi-screenshot', { method: 'POST', body: fd });

      // Mark booking as upi_pending
      await fetch('/api/bookings/upi-pending', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_ref: bookingRef, payment_method: 'upi' }),
      });

      window.location.href = 'booking-confirmed.html?ref=' + bookingRef + '&method=upi';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'I\'ve Paid — Complete Booking';
      alert('Something went wrong. Please try again.');
    }
  }
</script>
</body>
</html>
