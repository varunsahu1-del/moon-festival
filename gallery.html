    };

    const folders = {
      '2023': 'Gallery Page Images/2023',
      '2024': 'Gallery Page Images/2024',
      '2025-mulshi': 'Gallery Page Images/2025 Mulshi',
      '2025-goa': 'Gallery Page Images/2025 Goa'
    };

    const masonry = document.getElementById('gallery-masonry');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const lightboxBackdrop = document.getElementById('lightboxBackdrop');

    const categoryOrder = ['2025-goa', '2025-mulshi', '2024', '2023'];
    let currentIndex = 0;
    let currentSrcs = [];

    const BATCH = 30;
    let allSrcs = [];
    let loadedCount = 0;
    let sentinel = null;
    let sentinelObserver = null;
    let batchLoading = false;

    function makeItem(src, idx) {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Moon Festival';
      img.loading = 'lazy';
      const overlay = document.createElement('div');
      overlay.className = 'gallery-item-overlay';
      overlay.innerHTML = '<span>View</span>';
      div.appendChild(img);
      div.appendChild(overlay);
      div.addEventListener('click', () => openLightbox(idx));
      return div;
    }

    function loadBatch() {
      if (batchLoading) return;
      batchLoading = true;
      const end = Math.min(loadedCount + BATCH, allSrcs.length);
      const fragment = document.createDocumentFragment();
      for (let i = loadedCount; i < end; i++) {
        fragment.appendChild(makeItem(allSrcs[i], i));
      }
      loadedCount = end;
      if (sentinel) masonry.insertBefore(fragment, sentinel);
      else masonry.appendChild(fragment);
      if (loadedCount >= allSrcs.length && sentinel) {
        sentinelObserver.disconnect();
        sentinel.remove();
        sentinel = null;
      }
      // Release lock after layout has a chance to reflow
      requestAnimationFrame(() => { batchLoading = false; });
    }

    function buildItems(filter) {
      const cats = filter === 'all' ? categoryOrder : [filter];
      allSrcs = [];
      currentSrcs = [];
      cats.forEach(cat => {
        images[cat].forEach(file => {
          allSrcs.push(folders[cat] + '/' + file);
        });
      });
      currentSrcs = allSrcs;
      loadedCount = 0;
      masonry.innerHTML = '';

      // Add sentinel at bottom for infinite scroll
      if (sentinelObserver) sentinelObserver.disconnect();
      sentinel = document.createElement('div');
      sentinel.style.height = '1px';
      masonry.appendChild(sentinel);
      sentinelObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) loadBatch();
      }, { rootMargin: '400px' });
      sentinelObserver.observe(sentinel);

      loadBatch(); // first batch immediately
    }

    function setLightboxImage(src) {
      lightboxImg.src = src;
      lightboxBackdrop.style.backgroundImage = 'url("' + src.replace(/"/g, '\\"') + '")';
      lightboxCounter.textContent = (currentIndex + 1) + ' / ' + currentSrcs.length;
    }

    const typeRow = document.querySelector('.gallery-type-row');
    const filterRowEl = document.querySelector('.gallery-filter-row');

    function openLightbox(idx) {
      currentIndex = idx;
      setLightboxImage(currentSrcs[currentIndex]);
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function navigate(dir) {
      currentIndex = (currentIndex + dir + currentSrcs.length) % currentSrcs.length;
      lightboxImg.style.opacity = '0';
      setTimeout(() => {
        setLightboxImage(currentSrcs[currentIndex]);
        lightboxImg.style.opacity = '1';
      }, 120);
    }

    buildItems('2025-goa');

    // Media type tabs
    const typeBtns = document.querySelectorAll('.gallery-type');
    const panels = document.querySelectorAll('.gallery-panel');
    const filterRow = document.querySelector('.gallery-filter-row');
    typeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        typeBtns.forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.type;
        panels.forEach(p => p.classList.toggle('active', p.id === 'panel-' + type));
        filterRow.style.display = type === 'photos' ? '' : 'none';
      });
    });

    // Year sub-filter
    const filters = document.querySelectorAll('.gallery-filter');
    filters.forEach(f => {
      f.addEventListener('click', () => {
        filters.forEach(x => x.classList.remove('active'));
        f.classList.add('active');
        buildItems(f.dataset.filter);
      });
    });

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxBack').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', e => { e.stopPropagation(); navigate(-1); });
    document.getElementById('lightboxNext').addEventListener('click', e => { e.stopPropagation(); navigate(1); });
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    // Swipe support
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    }, { passive: true });

    function closeLightbox() {
      lightbox.classList.remove('open');
      if (filterRowEl) { filterRowEl.classList.remove('tabs-pinned'); filterRowEl.style.top = ''; }
      lightbox.style.top = '';
      document.body.style.overflow = '';
    }
  </script>
