    }

    /* ── SECTIONS ──────────────────────────────────────── */
    .fac-section { background: var(--ink); padding: var(--s-12) 0 var(--s-4); text-align: center; }
    .fac-section .container { display: flex; flex-direction: column; align-items: center; }
    .fac-section + .fac-section { padding-top: var(--s-6); }

    .fac-category-label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #EDD4B2;
      text-transform: uppercase;
      margin: 0 0 0.5rem;
      text-align: center;
    }
    .fac-category-count {
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(0.6rem, 0.9vw, 0.72rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.75);
      margin: 0 0 1.1rem;
      text-align: center;
    }
    .fac-category-rule {
      width: clamp(2.5rem, 6vw, 4rem);
      height: 0.5px;
      background: rgba(237,212,178,0.25);
      margin: 0 auto 0.5rem;
    }

    /* ── CATEGORY ICONS ───────────────────────────────── */
    .cat-icon {
      width: clamp(2rem, 3.5vw, 2.8rem);
      height: clamp(2rem, 3.5vw, 2.8rem);
      display: inline-block;
      vertical-align: middle;
      margin-bottom: 0.15em;
    }
    .fac-category-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6em;
    }

    @keyframes iconSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1);    opacity: 1; }
      50%       { transform: scale(1.12); opacity: 0.75; }
    }
    @keyframes iconSway {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      40%       { transform: translateY(-4px); }
      60%       { transform: translateY(-2px); }
    }
    @keyframes iconBreath {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }
    @keyframes iconFlicker {
      0%, 90%, 100% { opacity: 1; }
      95%            { opacity: 0.4; }
    }

    .cat-icon-yoga  { animation: iconBreath 4s ease-in-out infinite; }
    .cat-icon-dance { animation: iconSway   3.5s ease-in-out infinite; }
    .cat-icon-music { animation: iconPulse  3s   ease-in-out infinite; }
    .cat-icon-art   { animation: iconSpin   12s  linear infinite; }
    .cat-icon-bands { animation: iconBounce 1.6s ease-in-out infinite; }
    .cat-icon-talks { animation: iconFlicker 5s  ease-in-out infinite; }

    .fac-divider {
      width: 3rem; height: 0.5px;
      background: rgba(237,212,178,0.1);
      margin: var(--s-10) auto 0;
    }

    /* ── FACILITATOR TILE GRID ─────────────────────────── */
    .fac-thumb-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      width: 100%;
    }
    .fac-thumb-card {
      width: calc(25% - 3px);
    }
    @media (max-width: 700px) {
      .fac-thumb-card { width: calc(33.33% - 2px); }
      .fac-thumb-info { padding: 0.8rem 0.5rem 0.6rem; }
      .fac-thumb-name { font-size: 0.5rem; letter-spacing: 0.12em; }
      .fac-thumb-role { font-size: 0.65rem; letter-spacing: 0.06em; }
      .fac-thumb-more { font-size: 0.5rem; letter-spacing: 0.14em; }
    }
    @media (max-width: 480px) {
      .fac-thumb-card { width: calc(50% - 2px); }
      .fac-thumb-info { padding: 0.8rem 0.5rem 0.6rem; }
      .fac-thumb-name { font-size: 0.6rem; letter-spacing: 0.12em; }
      .fac-thumb-role { font-size: 0.7rem; letter-spacing: 0.06em; }
      .fac-thumb-more { font-size: 0.55rem; letter-spacing: 0.14em; }
    }

    .fac-thumb-card {
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
      cursor: pointer;
    }

    .fac-thumb-img {
      position: absolute;
      inset: 0;
    }
    .fac-thumb-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s cubic-bezier(0.22,1,0.36,1);
    }
    .fac-thumb-card:hover .fac-thumb-img img {
      transform: scale(1.05);
    }

    .fac-thumb-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,7,2,0.88) 0%, rgba(10,7,2,0.35) 50%, transparent 100%);
    }

    .fac-thumb-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.4rem 1.2rem 1.1rem;
    }

    .fac-thumb-name {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.65);
      margin: 0 0 0.25rem;
      /* hide name — re-enable when 2026 facilitators are ready */
      display: none;
    }

    .fac-thumb-role {
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #EDD4B2;
      margin: 0 0 0.55rem;
      line-height: 1.2;
    }

    .fac-thumb-more {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #B06030;
      transition: letter-spacing 0.3s;
    }
    .fac-thumb-card:hover .fac-thumb-more {
      letter-spacing: 0.3em;
    }

    /* ── POPUP MODAL ───────────────────────────────────── */
    .fac-modal-backdrop {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(8,7,5,0.88);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .fac-modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }
    .fac-modal {
      background: var(--ink);
      border: 0.5px solid rgba(237,212,178,0.12);
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 42% 1fr;
      transform: translateY(28px) scale(0.97);
      transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .fac-modal-backdrop.open .fac-modal {
      transform: translateY(0) scale(1);
    }

    .fac-modal-img {
      position: relative;
      overflow: hidden;
    }
    .fac-modal-img img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
    }
    .fac-modal-img-tint {
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 60%, var(--ink) 100%);
    }

    .fac-modal-body {
      padding: 2.5rem 2rem 2rem 1.8rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.8rem;
    }
    .fac-modal-role {
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(1.3rem, 2.2vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #EDD4B2;
      margin: 0;
      line-height: 1.2;
    }
    .fac-modal-name {
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(0.78rem, 1.2vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(237,212,178,0.6);
      margin: 0;
    }
    .fac-modal-divider {
      width: 3rem; height: 0.5px;
      background: rgba(237,212,178,0.35);
      margin: 0.4rem 0;
    }
    .fac-modal-desc {
      font-family: 'Open Sans', sans-serif;
      font-size: clamp(0.82rem, 1.2vw, 0.9rem);
      font-weight: 300;
      line-height: 1.9;
      color: rgba(237,212,178,0.82);

      flex: 1;
    }
    .fac-modal-close {
      position: absolute;
      top: 1.2rem; right: 1.2rem;
      background: none; border: none;
      color: rgba(237,212,178,0.5);
      cursor: pointer;

    @media (max-width: 640px) {
      .fac-modal { grid-template-columns: 1fr; grid-template-rows: 260px 1fr; max-height: 92vh; }
      .fac-modal-img { height: 260px; }
      .fac-modal-body { padding: 1.5rem 1.2rem; }
    }
  </style>
</head>

const CATEGORIES = [
  { key: 'yoga',   label: 'Yoga, Movement &amp; Fitness' },
  { key: 'dance',  label: 'Dance &amp; Play' },
  { key: 'music',  label: 'Music, Singing &amp; Kirtan' },
  { key: 'art',    label: 'Art' },
  { key: 'bands',  label: 'Bands, Ceremonies &amp; Acts' },
  { key: 'talks',  label: 'Talks' }
];

function phSVG() {
  return `<svg width="40" height="40"><use href="#ph"/></svg>`;
}

function buildGrid() {
  const container = document.getElementById('facSections');
  CATEGORIES.forEach((cat, ci) => {
    const members = FAC.filter(f => f.category === cat.key);
    if (!members.length) return;
    const cards = members.map((f, i) => {
      const imgHTML = f.img
        ? `<img src="${f.img}" alt="${f.name}" style="object-position:${f.pos};" loading="lazy" />`
        : phSVG();
      return `
        <div class="fac-thumb-card reveal" data-idx="${FAC.indexOf(f)}" tabindex="0" role="button" aria-label="Learn more about ${f.name}">
          <div class="fac-thumb-img">${imgHTML}</div>
          <div class="fac-thumb-overlay"></div>
          <div class="fac-thumb-info">
            <p class="fac-thumb-name">${f.name.toUpperCase()}</p>
            <p class="fac-thumb-role">${f.role}</p>
            <p class="fac-thumb-more">TBA &nbsp;→</p>
          </div>
        </div>`;
    }).join('');

    const divider = ci < CATEGORIES.length - 1 ? '<div class="fac-divider"></div>' : '';
    const ptop = ci === 0 ? '' : 'padding-top: var(--s-6);';
    const pbot = ci === CATEGORIES.length - 1 ? 'padding-bottom: var(--s-16);' : '';
    container.insertAdjacentHTML('beforeend', `
      <section class="fac-section" style="${ptop}${pbot}">
        <div class="container">
          <p class="fac-category-label reveal">${cat.label}</p>
          <p class="fac-category-count">${members.length} Facilitator${members.length !== 1 ? 's' : ''}</p>
          <div style="width:6rem;height:0.5px;background:rgba(237,212,178,0.35);margin:0.8rem auto 1.4rem;"></div>

          <div class="fac-thumb-grid">${cards}</div>
          ${divider}
        </div>
      </section>`);
  });

  // attach click/keyboard/hover handlers
  // modal disabled — re-enable when 2026 facilitators are ready
  document.querySelectorAll('.fac-thumb-card').forEach(card => {
    // card.addEventListener('click', () => openModal(parseInt(card.dataset.idx)));
    // card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(parseInt(card.dataset.idx)); }});
  });
}

// ── MODAL ──────────────────────────────────────────────
const backdrop = document.getElementById('facModal');
const modalImg = document.getElementById('facModalImg');
const modalRole = document.getElementById('facModalRole');
const modalName = document.getElementById('facModalName');
const modalDesc = document.getElementById('facModalDesc');

function openModal(idx) {
  const f = FAC[idx];
  modalImg.src = f.img || '';
  modalImg.alt = f.name;
  modalImg.style.objectPosition = f.pos;
  modalRole.textContent = f.role;
  modalName.textContent = f.name;
  modalDesc.textContent = f.desc;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('facModalClose').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── NAV ───────────────────────────────────────────────
const navToggle = document.getElementById('navToggle');
const navDrawer = document.getElementById('navDrawer');
navToggle.addEventListener('click', () => {
  const isOpen = navDrawer.classList.toggle('open');
  navToggle.classList.toggle('open', isOpen);
  navToggle.setAttribute('aria-expanded', isOpen);
  navDrawer.setAttribute('aria-hidden', !isOpen);
});
navDrawer.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    navDrawer.classList.remove('open');
    navToggle.classList.remove('open');
    navToggle.setAttribute('aria-expanded', false);
    navDrawer.setAttribute('aria-hidden', true);
  });
});

// ── REVEAL ────────────────────────────────────────────
buildGrid();
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }});
}, { threshold: 0.05 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
